name: Guild Snapshot (every 12h)

on:
  schedule:
    # 00:00 and 12:00 UTC — adjust to your preferred times.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Override snapshot date (YYYY-MM-DD), optional"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch snapshot
        env:
          TITANSDB_API_KEY: ${{ secrets.TITANSDB_API_KEY }}
        run: |
          cd scripts
          if [ -n "${{ github.event.inputs.snapshot_date }}" ]; then
            python3 fetch_snapshot.py --date "${{ github.event.inputs.snapshot_date }}"
          else
            python3 fetch_snapshot.py
          fi

      - name: Build report
        run: |
          cd scripts
          python3 build_report.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --staged --quiet || git commit -m "Guild snapshot"
          git push
